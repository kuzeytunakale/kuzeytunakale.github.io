<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapım Aşamasında | Kuzey Tuna Kale</title>
    <style>
        /* Font ve Genel Ayarlar */
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap');

        :root {
            --bg-color: #121212;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent-green: #4ade80;
            --accent-hover: #22c55e;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            line-height: 1.6;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        ::selection {
            background: var(--accent-green);
            color: #000;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .prompt-text {
            color: var(--accent-green);
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            background: rgba(74, 222, 128, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-block;
            background-color: var(--accent-green);
            color: #000;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="prompt-text">$ status --project</div>
            <div class="status-badge">● GELİŞTİRME AŞAMASINDA</div>
            <h1>Yapım Aşamasında</h1>
            <p>Bu proje henüz tamamlanmadı. Kodlama ve tasarım süreçleri devam ediyor, çok yakında burada olacak.</p>
            <a href="index.html" class="btn-back">← Ana Sayfaya Dön</a>
        </div>

        <footer>
            Kuzey Tuna Kale
        </footer>
    </div>

</body>
</html>
